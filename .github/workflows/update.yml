
name: Actualiser les actualités

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,11,16 * * *'

permissions:
  contents: write

jobs:
  actualites:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Collecter les actualités
        shell: bash
        run: |
          mkdir -p data/archive
          python3 - <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import json
          import re
          import html
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          feeds = [
              ("Maroc", "Maroc actualités"),
              ("Monde", "international actualités"),
              ("Économie", "économie Maroc monde"),
              ("Société", "société Maroc"),
              ("Technologies", "technologie intelligence artificielle"),
              ("Environnement", "environnement climat"),
              ("Culture", "culture Maroc monde"),
              ("Sport", "sport Maroc monde")
          ]

          items = []
          seen = set()

          for category, query in feeds:
              params = urllib.parse.urlencode({
                  "q": query + " when:1d",
                  "hl": "fr",
                  "gl": "MA",
                  "ceid": "MA:fr"
              })
              url = "https://news.google.com/rss/search?" + params

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())

                  for entry in root.findall(".//item")[:12]:
                      title = entry.findtext("title", "").strip()
                      link = entry.findtext("link", "").strip()
                      source = entry.find("source")
                      source_name = (
                          source.text if source is not None
                          else "Google News"
                      )

                      description = entry.findtext("description", "")
                      description = html.unescape(
                          re.sub(r"<[^>]+>", " ", description)
                      )
                      description = re.sub(
                          r"\s+", " ", description
                      ).strip()

                      date = entry.findtext("pubDate", "")
                      try:
                          published = parsedate_to_datetime(date).isoformat()
                      except Exception:
                          published = datetime.now(
                              timezone.utc
                          ).isoformat()

                      key = re.sub(r"\W+", "", title.lower())[:90]
                      if not title or not link or key in seen:
                          continue

                      seen.add(key)
                      items.append({
                          "title": title,
                          "description": description[:400],
                          "url": link,
                          "source": source_name,
                          "category": category,
                          "published": published
                      })

              except Exception as exc:
                  print("Flux indisponible:", category, str(exc))

          items.sort(
              key=lambda x: x["published"],
              reverse=True
          )

          if not items:
              raise RuntimeError("Aucune actualité collectée")

          now = datetime.now(timezone.utc)
          edition = {
              "updated": now.isoformat(),
              "items": items[:60]
          }

          Path("data/latest.json").write_text(
              json.dumps(
                  edition, ensure_ascii=False, indent=2
              ),
              encoding="utf-8"
          )

          day = now.strftime("%Y-%m-%d")
          Path(f"data/archive/{day}.json").write_text(
              json.dumps(
                  edition, ensure_ascii=False, indent=2
              ),
              encoding="utf-8"
          )

          days = sorted(
              (p.stem for p in Path("data/archive").glob("*.json")),
              reverse=True
          )
          Path("data/archive-index.json").write_text(
              json.dumps(days, ensure_ascii=False),
              encoding="utf-8"
          )

          print(f"{len(items)} actualités collectées")

          PY

      - name: Enregistrer les actualités
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique des actualités"
            git push
          fi
