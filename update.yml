name: Actualiser la revue de presse
on:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 11 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les flux
        run: python scripts/update.py
      - name: Publier les données
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then git commit -m 'Mise à jour automatique de la revue'; git push; fi
